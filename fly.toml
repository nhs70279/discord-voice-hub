# fly.toml app configuration file generated for discord-voice-hub on 2026-11-27T00:35:26Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'discord-voice-hub'
primary_region = 'iad'
kill_signal = 'SIGINT'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[env]
  COOKIE_SECURE = 'true'
  DATABASE_PATH = '/data/voice_hub.sqlite3'

[[mounts]]
  source = 'voicehub_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  # Start a stopped web Machine when a request arrives.
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

[[restart]]
  # Keep the Discord voice bot alive after either clean exits or crashes.
  policy = 'always'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
